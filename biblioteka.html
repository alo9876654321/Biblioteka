<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Бібліотека — система обліку</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.14.2/sql-asm.min.js"></script>
<style>
:root{
  --bg:#EEF0E4; --surface:#FFFFFF; --surface-2:#F7F6EE; --ink:#1C2B22; --ink-soft:#4B5A50;
  --primary:#2F4A3C; --primary-ink:#EAF1EA; --accent:#A8792E; --accent-ink:#3A2A0E;
  --danger:#9C3B2E; --danger-bg:#F6E4DF; --ok:#3D6B4A; --ok-bg:#E4EEE2;
  --border:#D9D5C4; --border-strong:#BDB79E; --shadow: 0 1px 2px rgba(28,43,34,.08), 0 8px 24px -12px rgba(28,43,34,.18);
  --radius:10px; --radius-sm:6px;
  --font-display:'Fraunces', Georgia, serif; --font-body:'Source Sans 3', system-ui, sans-serif; --font-mono:'Source Code Pro', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#142019; --surface:#1B2A22; --surface-2:#203026; --ink:#ECEAE0; --ink-soft:#AAB6AD;
    --primary:#7FAE93; --primary-ink:#12201A; --accent:#D2A94D; --accent-ink:#241A05;
    --danger:#E08672; --danger-bg:#3A2420; --ok:#8FC49E; --ok-bg:#1E3324;
    --border:#2C3B32; --border-strong:#3C4E43; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#142019; --surface:#1B2A22; --surface-2:#203026; --ink:#ECEAE0; --ink-soft:#AAB6AD;
  --primary:#7FAE93; --primary-ink:#12201A; --accent:#D2A94D; --accent-ink:#241A05;
  --danger:#E08672; --danger-bg:#3A2420; --ok:#8FC49E; --ok-bg:#1E3324;
  --border:#2C3B32; --border-strong:#3C4E43; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px;
  line-height:1.5; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0 0 4px; color:var(--ink); letter-spacing:-.01em;}
h1{font-size:28px; font-weight:700;}
h2{font-size:20px;}
h3{font-size:16px;}
p{margin:0 0 8px;}
a{color:inherit;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body); font-size:14px;}
::selection{background:var(--accent); color:var(--accent-ink);}

/* ---------- layout shell ---------- */
#root{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--primary); color:var(--primary-ink);
  position:sticky; top:0; z-index:40; box-shadow:var(--shadow);
}
.topbar .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:19px;}
.topbar .brand .mark{font-size:22px;}
.topbar .spacer{flex:1;}
.topbar .who{display:flex; align-items:center; gap:10px; font-size:13px;}
.topbar .who .name{font-weight:600;}
.topbar .who .role{opacity:.8; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
.iconbtn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:var(--primary-ink);
  border-radius:var(--radius-sm); padding:7px 12px; font-size:13px; font-weight:600;
}
.iconbtn:hover{background:rgba(255,255,255,.22);}
.shell{display:flex; flex:1; min-height:0;}
.sidebar{
  width:230px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  padding:14px 10px; display:flex; flex-direction:column; gap:2px;
}
.navbtn{
  display:flex; align-items:center; gap:10px; text-align:left; padding:9px 12px; border-radius:var(--radius-sm);
  border:none; background:transparent; color:var(--ink-soft); font-size:14px; font-weight:500; width:100%;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink);}
.navbtn.active{background:var(--primary); color:var(--primary-ink); font-weight:600;}
.navbtn .n{font-size:16px; width:18px; text-align:center;}
.content{flex:1; min-width:0; padding:22px 26px 60px; overflow-x:hidden;}
.content-inner{max-width:1180px; margin:0 auto;}

/* mobile */
.mobiletabs{display:none;}
@media (max-width: 860px){
  .sidebar{display:none;}
  .mobiletabs{
    display:flex; gap:6px; overflow-x:auto; padding:10px 12px; background:var(--surface);
    border-bottom:1px solid var(--border); position:sticky; top:52px; z-index:30;
  }
  .mobiletabs .navbtn{width:auto; white-space:nowrap; flex:none;}
  .content{padding:16px 14px 60px;}
}

/* ---------- generic components ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow);}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
.section-head .desc{color:var(--ink-soft); font-size:13.5px;}
.grid{display:grid; gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media (max-width: 900px){ .grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} }
@media (max-width: 560px){ .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;} }

.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.stat .num{font-family:var(--font-display); font-size:30px; font-weight:700; color:var(--primary);}
.stat .lbl{color:var(--ink-soft); font-size:12.5px; margin-top:2px;}

table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{
  text-align:left; padding:9px 10px; border-bottom:2px solid var(--border-strong); color:var(--ink-soft);
  font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:hover td{background:var(--surface-2);}
.tablewrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);}
.tablewrap table{border:none;}
.tablewrap th:first-child,.tablewrap td:first-child{padding-left:14px;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
.badge.ok{background:var(--ok-bg); color:var(--ok);}
.badge.warn{background:var(--danger-bg); color:var(--danger);}
.badge.neutral{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--border);}
.badge.accent{background:var(--accent); color:var(--accent-ink);}

.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:var(--radius-sm); border:1px solid var(--border-strong);
  background:var(--surface); color:var(--ink); padding:8px 14px; font-size:13.5px; font-weight:600;
}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn.danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn.sm{padding:5px 10px; font-size:12.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap;}

label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin:0 0 5px;}
.field{margin-bottom:13px;}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%; padding:8px 11px; border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
textarea{resize:vertical; min-height:64px;}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
@media (max-width:560px){.formgrid{grid-template-columns:1fr;}}
.hint{color:var(--ink-soft); font-size:12px; margin-top:4px;}
.stamp{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.02em;}

.modal-backdrop{position:fixed; inset:0; background:rgba(20,28,22,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;}
.modal{background:var(--surface); border-radius:var(--radius); max-width:560px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow); padding:22px 24px;}
.modal .mhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal .mhead button{background:none;border:none;font-size:20px;color:var(--ink-soft); line-height:1;}

.toast-wrap{position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:var(--radius-sm); font-size:13.5px; box-shadow:var(--shadow); max-width:320px;}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--ok);}

.empty{padding:34px 20px; text-align:center; color:var(--ink-soft);}
.empty .big{font-size:30px; margin-bottom:6px;}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap;}
.tabs button{background:none; border:none; padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--ink-soft); border-bottom:2px solid transparent;}
.tabs button.active{color:var(--primary); border-bottom-color:var(--primary);}

.login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:
  radial-gradient(circle at 20% 15%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 45%),
  var(--bg); padding:20px;}
.login-card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px 30px; box-shadow:var(--shadow);}
.login-mark{font-size:34px; margin-bottom:6px;}
.login-card h1{font-size:23px; margin-bottom:2px;}
.login-card .sub{color:var(--ink-soft); font-size:13px; margin-bottom:22px;}
.demo-accounts{margin-top:18px; padding-top:16px; border-top:1px dashed var(--border-strong); font-size:12px; color:var(--ink-soft);}
.demo-accounts .row{display:flex; justify-content:space-between; padding:3px 0; font-family:var(--font-mono); cursor:pointer;}
.demo-accounts .row:hover{color:var(--primary);}
.loginerr{background:var(--danger-bg); color:var(--danger); padding:9px 12px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:14px;}

.boot{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--ink-soft); font-size:14px;}
.boot .mark{font-size:34px;}
.spin{width:26px; height:26px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--primary); animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.searchbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.searchbar input[type=text]{max-width:280px;}
.searchbar select{max-width:170px;}

.book-title{font-weight:600;}
.book-sub{color:var(--ink-soft); font-size:12px;}
.avail{font-family:var(--font-mono); font-size:12.5px;}
.progress{height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; margin-top:4px; width:70px;}
.progress > div{height:100%; background:var(--accent);}

.kicker{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; margin-bottom:6px;}
footer.appfoot{text-align:center; color:var(--ink-soft); font-size:11.5px; padding:20px 0 6px;}
</style>
</head>
<body>
<div id="root"><div class="boot"><div class="mark">📚</div><div class="spin"></div><div>Завантаження бібліотеки…</div></div></div>
<div class="toast-wrap" id="toasts"></div>
<script>
"use strict";

/* ============================== STATE ============================== */
const State = {
  db: null,
  currentUser: null,
  route: "dashboard",
  routeParams: {},
  booted: false,
};

const IDB_NAME = "school-library-db";
const IDB_STORE = "files";
const IDB_KEY = "library.sqlite";

/* ============================== UTIL ============================== */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function escapeHtml(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function addDaysISO(iso, days){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+Number(days)); return d.toISOString().slice(0,10); }
function daysDiff(a,b){ const A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00"); return Math.round((B-A)/86400000); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("T")[0].split("-"); return `${d}.${m}.${y}`; }
function uid(){ return Math.random().toString(36).slice(2,9); }

function toast(msg, kind){
  const wrap = $("#toasts");
  const t = el(`<div class="toast ${kind==='err'?'err':kind==='ok'?'ok':''}">${escapeHtml(msg)}</div>`);
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; t.style.transition="opacity .3s"; setTimeout(()=>t.remove(),320); }, 3400);
}

async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* ============================== INDEXEDDB PERSISTENCE ============================== */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbLoad(){
  try{
    const conn = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = conn.transaction(IDB_STORE,"readonly");
      const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
      rq.onsuccess = ()=> resolve(rq.result || null);
      rq.onerror = ()=> reject(rq.error);
    });
  }catch(e){ console.warn("idbLoad failed", e); return null; }
}
async function idbSave(uint8arr){
  try{
    const conn = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = conn.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).put(uint8arr, IDB_KEY);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ console.warn("idbSave failed", e); return false; }
}
async function idbClear(){
  try{
    const conn = await idbOpen();
    return await new Promise((resolve,reject)=>{
      const tx = conn.transaction(IDB_STORE,"readwrite");
      tx.objectStore(IDB_STORE).delete(IDB_KEY);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> reject(tx.error);
    });
  }catch(e){ return false; }
}

let persistTimer = null;
function schedulePersist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(()=>{
    try{
      const data = State.db.export();
      idbSave(data);
    }catch(e){ console.warn("persist failed", e); }
  }, 150);
}

/* ============================== DB LAYER ============================== */
function q(sql, params){
  const stmt = State.db.prepare(sql);
  if(params) stmt.bind(params);
  const rows = [];
  while(stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}
function q1(sql, params){ const r = q(sql, params); return r.length? r[0] : null; }
function run(sql, params){
  State.db.run(sql, params||[]);
  schedulePersist();
}
function lastId(){ return q1("SELECT last_insert_rowid() AS id").id; }

function logAction(action, entityType, entityId, description){
  run(`INSERT INTO audit_log (user_id, action, entity_type, entity_id, description, created_at) VALUES (?,?,?,?,?,?)`,
    [State.currentUser? State.currentUser.id : null, action, entityType||null, entityId||null, description||"", nowISO()]);
}

function getSetting(key, def){
  const r = q1("SELECT value FROM settings WHERE key=?", [key]);
  return r ? r.value : def;
}
function setSetting(key, value){
  run("INSERT INTO settings(key,value) VALUES (?,?) ON CONFLICT(key) DO UPDATE SET value=excluded.value", [key, String(value)]);
}

/* ============================== SCHEMA + SEED ============================== */
const SCHEMA_SQL = `
CREATE TABLE genres (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  name TEXT NOT NULL UNIQUE
);
CREATE TABLE classes (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  name TEXT NOT NULL,
  school_year TEXT NOT NULL,
  teacher_id INTEGER,
  status TEXT NOT NULL DEFAULT 'Активний'
);
CREATE TABLE users (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  first_name TEXT NOT NULL,
  last_name TEXT NOT NULL,
  login TEXT NOT NULL UNIQUE,
  password_hash TEXT NOT NULL,
  role TEXT NOT NULL,
  class_id INTEGER,
  status TEXT NOT NULL DEFAULT 'Активний',
  created_at TEXT NOT NULL
);
CREATE TABLE books (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  title TEXT NOT NULL,
  author TEXT NOT NULL,
  isbn TEXT,
  genre_id INTEGER,
  publisher TEXT,
  publication_year INTEGER,
  description TEXT,
  total_copies INTEGER NOT NULL DEFAULT 0,
  available_copies INTEGER NOT NULL DEFAULT 0,
  status TEXT NOT NULL DEFAULT 'Активна',
  created_at TEXT NOT NULL
);
CREATE TABLE borrowings (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  user_id INTEGER NOT NULL,
  book_id INTEGER NOT NULL,
  quantity INTEGER NOT NULL,
  returned_quantity INTEGER NOT NULL DEFAULT 0,
  borrowed_at TEXT NOT NULL,
  due_at TEXT NOT NULL,
  returned_at TEXT,
  status TEXT NOT NULL DEFAULT 'Видано',
  issued_by INTEGER
);
CREATE TABLE audit_log (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  user_id INTEGER,
  action TEXT NOT NULL,
  entity_type TEXT,
  entity_id INTEGER,
  description TEXT,
  created_at TEXT NOT NULL
);
CREATE TABLE settings (
  key TEXT PRIMARY KEY,
  value TEXT NOT NULL
);
`;

async function seedDatabase(){
  State.db.run(SCHEMA_SQL);
  const now = nowISO();
  // genres
  ["Художня література","Наукова література","Підручники","Довідкова література","Дитяча література"].forEach(g=>{
    run("INSERT INTO genres(name) VALUES (?)", [g]);
  });
  // settings
  setSetting("max_books_per_user", "10");
  setSetting("default_loan_days", "14");
  setSetting("school_name", "Ліцей №1");

  // users (password hashes computed async)
  const admin_hash = await sha256Hex("admin123");
  const lib_hash = await sha256Hex("lib123");
  const t1_hash = await sha256Hex("teach123");
  const t2_hash = await sha256Hex("teach123");

  run(`INSERT INTO users (first_name,last_name,login,password_hash,role,class_id,status,created_at) VALUES (?,?,?,?,?,?,?,?)`,
    ["Олена","Коваленко","admin",admin_hash,"admin",null,"Активний",now]);
  run(`INSERT INTO users (first_name,last_name,login,password_hash,role,class_id,status,created_at) VALUES (?,?,?,?,?,?,?,?)`,
    ["Марія","Бондаренко","librarian",lib_hash,"librarian",null,"Активний",now]);
  run(`INSERT INTO users (first_name,last_name,login,password_hash,role,class_id,status,created_at) VALUES (?,?,?,?,?,?,?,?)`,
    ["Іван","Іваненко","teacher",t1_hash,"teacher",null,"Активний",now]);
  run(`INSERT INTO users (first_name,last_name,login,password_hash,role,class_id,status,created_at) VALUES (?,?,?,?,?,?,?,?)`,
    ["Наталія","Шевченко","teacher2",t2_hash,"teacher",null,"Активний",now]);

  // classes (teacher_id references the two teachers)
  const teacherIds = q("SELECT id FROM users WHERE role='teacher' ORDER BY id").map(r=>r.id);
  run(`INSERT INTO classes (name,school_year,teacher_id,status) VALUES (?,?,?,?)`, ["7-А","2026/2027", teacherIds[0], "Активний"]);
  run(`INSERT INTO classes (name,school_year,teacher_id,status) VALUES (?,?,?,?)`, ["8-Б","2026/2027", teacherIds[1], "Активний"]);
  run(`INSERT INTO classes (name,school_year,teacher_id,status) VALUES (?,?,?,?)`, ["9-А","2026/2027", null, "Активний"]);

  const classIds = q("SELECT id FROM classes ORDER BY id").map(r=>r.id);
  run("UPDATE users SET class_id=? WHERE login='teacher'", [classIds[0]]);
  run("UPDATE users SET class_id=? WHERE login='teacher2'", [classIds[1]]);

  const genreIds = {};
  q("SELECT id,name FROM genres").forEach(g=> genreIds[g.name]=g.id);

  // books
  const books = [

async function login(loginVal, passVal){
  const user = q1("SELECT * FROM users WHERE login=?", [loginVal.trim()]);
  if(!user) return {ok:false, msg:"Користувача з таким логіном не знайдено."};
  if(user.status !== "Активний") return {ok:false, msg:"Обліковий запис деактивовано. Зверніться до адміністратора."};
  const hash = await sha256Hex(passVal);
  if(hash !== user.password_hash) return {ok:false, msg:"Невірний пароль."};
  State.currentUser = user;
  logAction("Вхід у систему","user",user.id, `${user.last_name} ${user.first_name} увійшов(-ла) у систему.`);
  return {ok:true};
}

/* ============================== DOMAIN HELPERS ============================== */
function isOverdue(b){
  return (b.status==="Видано" || b.status==="Частково повернено") && b.due_at < todayISO();
}
function displayStatus(b){
  if(isOverdue(b)) return "Прострочено";
  return b.status;
}
function userFullName(u){ return u ? `${u.last_name} ${u.first_name}` : "—"; }
function className(classId){
  if(!classId) return "—";
  const c = q1("SELECT name FROM classes WHERE id=?", [classId]);
  return c ? c.name : "—";
}
function currentBorrowedCount(userId){
  const r = q1(`SELECT COALESCE(SUM(quantity-returned_quantity),0) AS c FROM borrowings WHERE user_id=? AND status IN ('Видано','Частково повернено')`, [userId]);
  return r.c;
}

/* ---- Borrow (issue) ---- */
function issueBorrowing(userId, bookId, quantity, dueDays){
  quantity = parseInt(quantity,10);
  const user = q1("SELECT * FROM users WHERE id=?", [userId]);
  const book = q1("SELECT * FROM books WHERE id=?", [bookId]);
  const maxBooks = parseInt(getSetting("max_books_per_user","10"),10);
  const loanDays = dueDays || parseInt(getSetting("default_loan_days","14"),10);

  if(!user) return {ok:false, msg:"Користувача не знайдено."};
  if(user.status !== "Активний") return {ok:false, msg:"Обліковий запис користувача неактивний."};
  if(!book) return {ok:false, msg:"Книгу не знайдено."};
  if(book.status !== "Активна") return {ok:false, msg:"Ця книга архівна і недоступна для видачі."};
  if(!quantity || quantity < 1) return {ok:false, msg:"Некоректна кількість примірників."};
  if(quantity > book.available_copies) return {ok:false, msg:`Неможливо видати книгу. Доступно лише ${book.available_copies} примірники(-ів).`};
  const already = currentBorrowedCount(userId);
  if(already + quantity > maxBooks) return {ok:false, msg:`Ви вже маєте максимальну кількість книг (ліміт: ${maxBooks}).`};

  const borrowedAt = todayISO();
  const dueAt = addDaysISO(borrowedAt, loanDays);
  run(`INSERT INTO borrowings (user_id,book_id,quantity,returned_quantity,borrowed_at,due_at,returned_at,status,issued_by)
       VALUES (?,?,?,0,?,?,NULL,'Видано',?)`, [userId, bookId, quantity, borrowedAt, dueAt, State.currentUser.id]);
  const borrowId = lastId();
  run("UPDATE books SET available_copies = available_copies - ? WHERE id=?", [quantity, bookId]);
  logAction("Видача книги","borrowing",borrowId, `${userFullName(user)} отримав(-ла) «${book.title}» (${quantity} прим.).`);
  return {ok:true, msg:"Книгу успішно видано."};
}

/* ---- Return ---- */
function returnBorrowing(borrowId, returnQty){
  const b = q1("SELECT * FROM borrowings WHERE id=?", [borrowId]);
  if(!b) return {ok:false, msg:"Операцію не знайдено."};
  const remaining = b.quantity - b.returned_quantity;
  returnQty = parseInt(returnQty,10);
  if(!returnQty || returnQty < 1) return {ok:false, msg:"Некоректна кількість."};
  if(returnQty > remaining) return {ok:false, msg:`Неможливо повернути більше, ніж видано. Залишається видано: ${remaining}.`};

  const newReturned = b.returned_quantity + returnQty;
  const fullyReturned = newReturned >= b.quantity;
  run(`UPDATE borrowings SET returned_quantity=?, status=?, returned_at=? WHERE id=?`,
    [newReturned, fullyReturned ? "Повернено" : "Частково повернено", fullyReturned ? todayISO() : b.returned_at, borrowId]);
  run("UPDATE books SET available_copies = available_copies + ? WHERE id=?", [returnQty, b.book_id]);
  const book = q1("SELECT title FROM books WHERE id=?", [b.book_id]);
  const user = q1("SELECT * FROM users WHERE id=?", [b.user_id]);
  logAction("Повернення книги","borrowing",borrowId, `${userFullName(user)} повернув(-ла) «${book.title}» (${returnQty} прим.).`);
  return {ok:true, msg:"Книгу успішно повернено."};
}

/* ---- Books CRUD ---- */
function saveBook(data, editId){
  if(!data.title || !data.author) return {ok:false, msg:"Назва та автор обов'язкові."};
  const total = parseInt(data.total_copies,10);
  if(isNaN(total) || total < 0) return {ok:false, msg:"Кількість примірників не може бути від'ємною."};
  if(editId){
    const existing = q1("SELECT * FROM books WHERE id=?", [editId]);
    const issued = existing.total_copies - existing.available_copies;
    if(total < issued) return {ok:false, msg:`Неможливо встановити кількість менше за вже видану (${issued}).`};
    const newAvailable = total - issued;
    run(`UPDATE books SET title=?,author=?,isbn=?,genre_id=?,publisher=?,publication_year=?,description=?,total_copies=?,available_copies=? WHERE id=?`,
      [data.title,data.author,data.isbn||null,data.genre_id||null,data.publisher||null,data.publication_year||null,data.description||null,total,newAvailable,editId]);
    logAction("Редагування книги","book",editId, `Оновлено дані книги «${data.title}».`);
    return {ok:true, msg:"Книгу оновлено."};
  } else {
    run(`INSERT INTO books (title,author,isbn,genre_id,publisher,publication_year,description,total_copies,available_copies,status,created_at)
         VALUES (?,?,?,?,?,?,?,?,?,?,?)`,
      [data.title,data.author,data.isbn||null,data.genre_id||null,data.publisher||null,data.publication_year||null,data.description||null,total,total,"Активна",nowISO()]);
    const id = lastId();
    logAction("Додавання книги","book",id, `Додано нову книгу «${data.title}».`);
    return {ok:true, msg:"Книгу додано."};
  }
}
function archiveBook(id, archive){
  run("UPDATE books SET status=? WHERE id=?", [archive?"Архівна":"Активна", id]);
  logAction(archive?"Архівування книги":"Відновлення книги","book",id, "");
}
function ensureGenre(name){
  name = (name||"").trim();
  if(!name) return null;
  const existing = q1("SELECT id FROM genres WHERE name=?", [name]);
  if(existing) return existing.id;
  run("INSERT INTO genres(name) VALUES (?)", [name]);
  return lastId();
}

/* ---- Users CRUD ---- */
async function saveUser(data, editId, actorRole){
  if(!data.first_name || !data.last_name || !data.login) return {ok:false, msg:"Заповніть ім'я, прізвище та логін."};
  const dup = q1("SELECT id FROM users WHERE login=? AND id!=?", [data.login, editId||-1]);
  if(dup) return {ok:false, msg:"Такий логін вже зайнято."};
  if(actorRole==="librarian" && data.role==="admin") return {ok:false, msg:"Бібліотекар не може призначати роль адміністратора."};
  if(editId){
    let sql = `UPDATE users SET first_name=?,last_name=?,login=?,class_id=? WHERE id=?`;
    let params = [data.first_name,data.last_name,data.login,data.class_id||null,editId];
    run(sql, params);
    if(actorRole==="admin" && data.role){
      run("UPDATE users SET role=? WHERE id=?", [data.role, editId]);
    }
    if(data.password){
      const hash = await sha256Hex(data.password);
      run("UPDATE users SET password_hash=? WHERE id=?", [hash, editId]);
    }
    logAction("Редагування користувача","user",editId, `Оновлено дані користувача ${data.last_name} ${data.first_name}.`);
    return {ok:true, msg:"Користувача оновлено."};
  } else {
    const pass = data.password || Math.random().toString(36).slice(2,8);
    const hash = await sha256Hex(pass);
    run(`INSERT INTO users (first_name,last_name,login,password_hash,role,class_id,status,created_at) VALUES (?,?,?,?,?,?,?,?)`,
      [data.first_name,data.last_name,data.login,hash,data.role||"teacher",data.class_id||null,"Активний",nowISO()]);
    const id = lastId();
    logAction("Додавання користувача","user",id, `Додано користувача ${data.last_name} ${data.first_name} (${roleLabel(data.role||"teacher")}).`);
    return {ok:true, msg:`Користувача додано. Тимчасовий пароль: ${pass}`, tempPass: data.password?null:pass};
  }
}
function setUserStatus(id, status){
  run("UPDATE users SET status=? WHERE id=?", [status, id]);
  logAction(status==="Активний"?"Відновлення користувача":"Деактивація користувача","user",id, "");
}

/* ============================== BOOKS ============================== */
function viewBooks(){
  const canEdit = State.currentUser.role==="admin" || State.currentUser.role==="librarian";
  const wrap = el(`<div></div>`);
  const genres = q("SELECT * FROM genres ORDER BY name");
  let filters = {search:"", genre:"", status:"active"};

  function draw(){
    let sql = "SELECT b.*, g.name AS genre_name FROM books b LEFT JOIN genres g ON g.id=b.genre_id WHERE 1=1";
    const params = [];
    if(filters.search){ sql += " AND (b.title LIKE ? OR b.author LIKE ? OR b.isbn LIKE ?)"; const s=`%${filters.search}%`; params.push(s,s,s); }
    if(filters.genre){ sql += " AND b.genre_id=?"; params.push(filters.genre); }
    if(filters.status==="active"){ sql += " AND b.status='Активна'"; }
    if(filters.status==="archived"){ sql += " AND b.status='Архівна'"; }
    sql += " ORDER BY b.title";
    const rows = q(sql, params);

    wrap.querySelector("#booksBody").innerHTML = rows.length ? rows.map(r=>`
      <tr>
        <td><div class="book-title">${escapeHtml(r.title)}</div><div class="book-sub">${escapeHtml(r.author)}${r.publication_year?`, ${r.publication_year}`:""}</div></td>
        <td>${escapeHtml(r.genre_name||"—")}</td>
        <td class="stamp">${escapeHtml(r.isbn||"—")}</td>
        <td><span class="avail">${r.available_copies} з ${r.total_copies}</span><div class="progress"><div style="width:${r.total_copies? (100*r.available_copies/r.total_copies):0}%"></div></div></td>
        <td>${r.status==="Активна"?'<span class="badge ok">Активна</span>':'<span class="badge neutral">Архівна</span>'}</td>
        <td>${canEdit? `<div class="btnrow">
            <button class="btn sm" data-edit="${r.id}">Редагувати</button>
            <button class="btn sm ${r.status==='Активна'?'danger':''}" data-arch="${r.id}" data-to="${r.status==='Активна'?1:0}">${r.status==='Активна'?'Архівувати':'Відновити'}</button>
          </div>` : ""}</td>
      </tr>`).join("") : `<tr><td colspan="6"><div class="empty"><div class="big">📕</div>Книг за цим фільтром не знайдено.</div></td></tr>`;

    wrap.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=> openBookModal(parseInt(b.dataset.edit))));
    wrap.querySelectorAll("[data-arch]").forEach(b=> b.addEventListener("click", ()=>{
      archiveBook(parseInt(b.dataset.arch), b.dataset.to==="1");
      toast(b.dataset.to==="1"?"Книгу заархівовано.":"Книгу відновлено.","ok");
      draw();
    }));
  }

  function openBookModal(editId){
    const book = editId ? q1("SELECT * FROM books WHERE id=?",[editId]) : null;
    openModal(`
      <div class="mhead"><h2>${editId?"Редагування книги":"Нова книга"}</h2><button onclick="closeModal()">✕</button></div>
      <form id="bookForm">
        <div class="field"><label>Назва *</label><input type="text" name="title" value="${escapeHtml(book?.title||"")}" required></div>
        <div class="formgrid">
          <div class="field"><label>Автор *</label><input type="text" name="author" value="${escapeHtml(book?.author||"")}" required></div>
          <div class="field"><label>ISBN</label><input type="text" name="isbn" value="${escapeHtml(book?.isbn||"")}"></div>
        </div>
        <div class="formgrid">
          <div class="field"><label>Жанр</label>
            <select name="genre_id">
              <option value="">— не обрано —</option>
              ${genres.map(g=>`<option value="${g.id}" ${book&&book.genre_id===g.id?"selected":""}>${escapeHtml(g.name)}</option>`).join("")}
            </select>
          </div>
          <div class="field"><label>Новий жанр (якщо потрібно)</label><input type="text" name="new_genre" placeholder="напр. Поезія"></div>
        </div>
        <div class="formgrid">
          <div class="field"><label>Видавництво</label><input type="text" name="publisher" value="${escapeHtml(book?.publisher||"")}"></div>
          <div class="field"><label>Рік видання</label><input type="number" name="publication_year" value="${book?.publication_year||""}"></div>
        </div>
        <div class="field"><label>Опис</label><textarea name="description">${escapeHtml(book?.description||"")}</textarea></div>
        <div class="field"><label>Кількість примірників *</label><input type="number" min="0" name="total_copies" value="${book?book.total_copies:1}" required></div>
        ${book? `<div class="hint">Видано зараз: ${book.total_copies-book.available_copies} прим. Доступно: ${book.available_copies} прим.</div>`:""}
        <div class="btnrow" style="margin-top:16px;">
          <button type="submit" class="btn primary">Зберегти</button>
          <button type="button" class="btn" onclick="closeModal()">Скасувати</button>
        </div>
      </form>
    `);
    $("#bookForm").addEventListener("submit",(e)=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      let genreId = fd.get("genre_id") || null;
      const newGenre = fd.get("new_genre");
      if(newGenre && newGenre.trim()) genreId = ensureGenre(newGenre);
      const data = {
        title: fd.get("title"), author: fd.get("author"), isbn: fd.get("isbn"),
        genre_id: genreId, publisher: fd.get("publisher"), publication_year: fd.get("publication_year")||null,
        description: fd.get("description"), total_copies: fd.get("total_copies"),
      };
      const res = saveBook(data, editId);
      if(res.ok){ closeModal(); toast(res.msg,"ok"); draw(); } else { toast(res.msg,"err"); }
    });
  }
  window.__openBookModal = openBookModal;

  wrap.innerHTML = `
    <div class="section-head">
      <div><div class="kicker">Каталог</div><h1>Книги</h1><div class="desc">Облік назв, примірників та жанрів.</div></div>
      ${canEdit? `<button class="btn primary" id="addBookBtn">+ Додати книгу</button>` : ""}
    </div>
    <div class="searchbar">
      <input type="text" id="fSearch" placeholder="Пошук за назвою, автором, ISBN…">
      <select id="fGenre"><option value="">Усі жанри</option>${genres.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join("")}</select>
      <select id="fStatus"><option value="active">Активні</option><option value="archived">Архівні</option><option value="">Усі</option></select>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Книга</th><th>Жанр</th><th>ISBN</th><th>Наявність</th><th>Статус</th><th></th></tr></thead>
        <tbody id="booksBody"></tbody>
      </table>
    </div>
  `;
  wrap.querySelector("#fSearch").addEventListener("input", e=>{ filters.search=e.target.value; draw(); });
  wrap.querySelector("#fGenre").addEventListener("change", e=>{ filters.genre=e.target.value; draw(); });
  wrap.querySelector("#fStatus").addEventListener("change", e=>{ filters.status=e.target.value; draw(); });
  if(canEdit) wrap.querySelector("#addBookBtn").addEventListener("click", ()=> openBookModal(null));
  draw();
  return wrap;
}

      </tr>`;
    }).join("") : `<tr><td colspan="7"><div class="empty"><div class="big">✅</div>Немає активних видач.</div></td></tr>`;
    wrap.querySelectorAll("[data-ret]").forEach(btn=> btn.addEventListener("click", ()=> openReturnModal(parseInt(btn.dataset.ret), parseInt(btn.dataset.rem), btn.dataset.title)));

/* ============================== STATISTICS ============================== */
function viewStats(){
  const wrap = el(`<div></div>`);
  let period = "month";
  function periodBounds(p){
    const t = todayISO();
    if(p==="today") return [t,t];
    if(p==="week") return [addDaysISO(t,-7), t];
    if(p==="month") return [addDaysISO(t,-30), t];
    if(p==="year") return [addDaysISO(t,-365), t];
    return [wrap.querySelector("#fromD")?.value||addDaysISO(t,-30), wrap.querySelector("#toD")?.value||t];
  }
  function draw(){
    const [from,to] = periodBounds(period);
    const issuedInPeriod = q1("SELECT COUNT(*) c FROM borrowings WHERE borrowed_at BETWEEN ? AND ?", [from,to]).c;
    const returnedInPeriod = q1("SELECT COUNT(*) c FROM borrowings WHERE returned_at BETWEEN ? AND ?", [from,to]).c;
    const byTeacher = q(`SELECT u.last_name,u.first_name, COALESCE(SUM(br.quantity),0) qty FROM users u
       LEFT JOIN borrowings br ON br.user_id=u.id AND br.borrowed_at BETWEEN ? AND ?
       WHERE u.role='teacher' GROUP BY u.id ORDER BY qty DESC`, [from,to]);
    const byClass = q(`SELECT c.name, COALESCE(SUM(br.quantity),0) qty FROM classes c
       LEFT JOIN users u ON u.class_id=c.id LEFT JOIN borrowings br ON br.user_id=u.id AND br.borrowed_at BETWEEN ? AND ?
       GROUP BY c.id ORDER BY qty DESC`, [from,to]);
    const popular = q(`SELECT b.title,b.author, COALESCE(SUM(br.quantity),0) qty FROM borrowings br JOIN books b ON b.id=br.book_id
       WHERE br.borrowed_at BETWEEN ? AND ? GROUP BY br.book_id ORDER BY qty DESC LIMIT 8`, [from,to]);

    wrap.querySelector("#statsBody").innerHTML = `
      <div class="grid cols-2" style="margin-bottom:18px;">
        <div class="stat"><div class="num">${issuedInPeriod}</div><div class="lbl">Видач за період (${fmtDate(from)} – ${fmtDate(to)})</div></div>
        <div class="stat"><div class="num">${returnedInPeriod}</div><div class="lbl">Повернень за період</div></div>
      </div>
      <div class="grid cols-3">
        <div class="card"><h3>Найпопулярніші книги</h3>${popular.length?`<div class="tablewrap"><table><tbody>${popular.map(p=>`<tr><td>${escapeHtml(p.title)}</td><td class="stamp">${p.qty}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Немає даних.</div>`}</div>
        <div class="card"><h3>За класами</h3>${byClass.length?`<div class="tablewrap"><table><tbody>${byClass.map(p=>`<tr><td>${escapeHtml(p.name)}</td><td class="stamp">${p.qty}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Немає даних.</div>`}</div>
        <div class="card"><h3>За вчителями</h3>${byTeacher.length?`<div class="tablewrap"><table><tbody>${byTeacher.map(p=>`<tr><td>${escapeHtml(p.last_name+" "+p.first_name)}</td><td class="stamp">${p.qty}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Немає даних.</div>`}</div>
      </div>
    `;
  }
  wrap.innerHTML = `
    <div class="section-head"><div><div class="kicker">Аналітика</div><h1>Статистика</h1><div class="desc">Показники бібліотеки за обраний період.</div></div></div>
    <div class="tabs" id="periodTabs">
      ${[["today","Сьогодні"],["week","Тиждень"],["month","Місяць"],["year","Навч. рік"],["custom","Довільний період"]].map(([k,l])=>`<button data-p="${k}" class="${k==='month'?'active':''}">${l}</button>`).join("")}
    </div>
    <div id="customRange" style="display:none; margin-bottom:14px;" class="formgrid">
      <div class="field"><label>Від</label><input type="date" id="fromD" value="${addDaysISO(todayISO(),-30)}"></div>
      <div class="field"><label>До</label><input type="date" id="toD" value="${todayISO()}"></div>
    </div>
    <div id="statsBody"></div>
  `;
  wrap.querySelectorAll("#periodTabs button").forEach(b=> b.addEventListener("click", ()=>{
    wrap.querySelectorAll("#periodTabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); period = b.dataset.p;
    wrap.querySelector("#customRange").style.display = period==="custom" ? "grid" : "none";
    draw();
  }));
  const fromEl = wrap.querySelector("#fromD"), toEl = wrap.querySelector("#toD");
  if(fromEl) fromEl.addEventListener("change", draw);
  if(toEl) toEl.addEventListener("change", draw);
  draw();
  return wrap;
}

/* ============================== CSV EXPORT ============================== */
function toCsv(headers, rows){
  const esc = v => {
    const s = v===null||v===undefined ? "" : String(v);
    return /[",\n;]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const lines = [headers.map(esc).join(";")];
  rows.forEach(r=> lines.push(r.map(esc).join(";")));
  return "\uFEFF" + lines.join("\r\n");
}
async function exportCsv(filename, headers, rows){
  const csv = toCsv(headers, rows);
  try{
    const downloads = await claude.use("downloads");
    if(!downloads){ toast("Завантаження файлів недоступне в цьому перегляді.","err"); return; }
    await downloads.save({filename, data: csv});
    toast("Файл збережено.","ok");
  }catch(e){
    if(e && e.code === "declined"){ /* user cancelled, no toast needed */ }
    else { console.warn(e); toast("Не вдалося зберегти файл.","err"); }
  }
}

/* ============================== TEACHER: CATALOG ============================== */
function viewCatalog(){
  const wrap = el(`<div></div>`);
  const genres = q("SELECT * FROM genres ORDER BY name");
  let filters = {search:"", genre:"", avail:""};

  function draw(){
    let sql = "SELECT b.*, g.name AS genre_name FROM books b LEFT JOIN genres g ON g.id=b.genre_id WHERE b.status='Активна'";
    const params=[];
    if(filters.search){ sql+=" AND (b.title LIKE ? OR b.author LIKE ? OR b.isbn LIKE ?)"; const s=`%${filters.search}%`; params.push(s,s,s); }
    if(filters.genre){ sql+=" AND b.genre_id=?"; params.push(filters.genre); }
    if(filters.avail==="yes"){ sql+=" AND b.available_copies>0"; }
    sql += " ORDER BY b.title";
    const rows = q(sql, params);
    const myCount = currentBorrowedCount(State.currentUser.id);
    const maxBooks = parseInt(getSetting("max_books_per_user","10"),10);

    wrap.querySelector("#catBody").innerHTML = rows.length ? rows.map(r=>`
      <tr>
        <td><div class="book-title">${escapeHtml(r.title)}</div><div class="book-sub">${escapeHtml(r.author)}${r.publication_year?`, ${r.publication_year}`:""} · ${escapeHtml(r.genre_name||"без жанру")}</div></td>
        <td><span class="avail">${r.available_copies} з ${r.total_copies}</span><div class="progress"><div style="width:${r.total_copies?(100*r.available_copies/r.total_copies):0}%"></div></div></td>
        <td><button class="btn sm primary" data-take="${r.id}" data-title="${escapeHtml(r.title)}" data-avail="${r.available_copies}" ${r.available_copies<1||myCount>=maxBooks?"disabled":""}>Взяти</button></td>
      </tr>`).join("") : `<tr><td colspan="3"><div class="empty"><div class="big">🔎</div>Нічого не знайдено.</div></td></tr>`;

    wrap.querySelectorAll("[data-take]").forEach(btn=> btn.addEventListener("click", ()=> openTakeModal(parseInt(btn.dataset.take), btn.dataset.title, parseInt(btn.dataset.avail))));
  }

  function openTakeModal(bookId, title, avail){
    const maxBooks = parseInt(getSetting("max_books_per_user","10"),10);
    const days = getSetting("default_loan_days","14");
    openModal(`
      <div class="mhead"><h2>Взяти книгу</h2><button onclick="closeModal()">✕</button></div>
      <p class="hint">«${escapeHtml(title)}» · доступно ${avail} прим. · строк повернення — ${days} днів.</p>
      <form id="takeForm">
        <div class="field"><label>Кількість примірників</label><input type="number" name="qty" min="1" max="${avail}" value="1" required></div>
        <div class="btnrow"><button type="submit" class="btn primary">Взяти</button><button type="button" class="btn" onclick="closeModal()">Скасувати</button></div>
      </form>
    `);
    $("#takeForm").addEventListener("submit",(e)=>{
      e.preventDefault();
      const qty = new FormData(e.target).get("qty");
      const res = issueBorrowing(State.currentUser.id, bookId, qty, days);
      if(res.ok){ closeModal(); toast(res.msg,"ok"); draw(); } else toast(res.msg,"err");
    });
  }

  wrap.innerHTML = `
    <div class="section-head"><div><div class="kicker">Бібліотека</div><h1>Каталог книг</h1><div class="desc">Знайдіть книгу та візьміть доступний примірник.</div></div></div>
    <div class="searchbar">
      <input type="text" id="fSearch" placeholder="Назва, автор або ISBN…">
      <select id="fGenre"><option value="">Усі жанри</option>${genres.map(g=>`<option value="${g.id}">${escapeHtml(g.name)}</option>`).join("")}</select>
      <select id="fAvail"><option value="">Усі</option><option value="yes">Лише доступні</option></select>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Книга</th><th>Наявність</th><th></th></tr></thead><tbody id="catBody"></tbody></table></div>
  `;
  wrap.querySelector("#fSearch").addEventListener("input", e=>{ filters.search=e.target.value; draw(); });
  wrap.querySelector("#fGenre").addEventListener("change", e=>{ filters.genre=e.target.value; draw(); });
  wrap.querySelector("#fAvail").addEventListener("change", e=>{ filters.avail=e.target.value; draw(); });
  draw();
  return wrap;
}

/* ============================== TEACHER: MY BOOKS ============================== */
function viewMyBooks(){
  const wrap = el(`<div></div>`);
  function draw(){
    const rows = q(`SELECT br.*, b.title,b.author FROM borrowings br JOIN books b ON b.id=br.book_id
                     WHERE br.user_id=? AND br.status IN ('Видано','Частково повернено') ORDER BY br.borrowed_at DESC`, [State.currentUser.id]);
    wrap.querySelector("#mineBody").innerHTML = rows.length? rows.map(b=>{
      const remaining = b.quantity-b.returned_quantity;
      return `<tr>
        <td><div class="book-title">${escapeHtml(b.title)}</div><div class="book-sub">${escapeHtml(b.author)}</div></td>
        <td class="stamp">${remaining}</td>
        <td class="stamp">${fmtDate(b.borrowed_at)}</td>
        <td class="stamp">${fmtDate(b.due_at)}</td>
        <td>${isOverdue(b)?'<span class="badge warn">Прострочено</span>':(b.status==='Частково повернено'?'<span class="badge accent">Частково</span>':'<span class="badge ok">Видано</span>')}</td>
        <td><button class="btn sm primary" data-ret="${b.id}" data-rem="${remaining}" data-title="${escapeHtml(b.title)}">Повернути</button></td>
      </tr>`;
    }).join("") : `<tr><td colspan="6"><div class="empty"><div class="big">📚</div>Наразі ви не маєте книг на руках.</div></td></tr>`;
    wrap.querySelectorAll("[data-ret]").forEach(btn=> btn.addEventListener("click", ()=>{
      const id=parseInt(btn.dataset.ret), rem=parseInt(btn.dataset.rem), title=btn.dataset.title;
      openModal(`
        <div class="mhead"><h2>Повернення книги</h2><button onclick="closeModal()">✕</button></div>
        <p class="hint">«${escapeHtml(title)}» — у вас на руках: ${rem} прим.</p>
        <form id="retForm2">
          <div class="field"><label>Кількість до повернення</label><input type="number" name="qty" min="1" max="${rem}" value="${rem}" required></div>
          <div class="btnrow"><button type="submit" class="btn primary">Повернути</button><button type="button" class="btn" onclick="closeModal()">Скасувати</button></div>
        </form>
      `);
      $("#retForm2").addEventListener("submit",(e)=>{
        e.preventDefault();
        const qty = new FormData(e.target).get("qty");
        const res = returnBorrowing(id, qty);
        if(res.ok){ closeModal(); toast(res.msg,"ok"); draw(); } else toast(res.msg,"err");
      });
    }));
  }
  wrap.innerHTML = `
    <div class="section-head"><div><div class="kicker">Особисте</div><h1>Мої книги</h1><div class="desc">Книги, які зараз перебувають у вас на руках.</div></div></div>
    <div class="tablewrap"><table><thead><tr><th>Книга</th><th>К-сть</th><th>Видано</th><th>Повернути до</th><th>Статус</th><th></th></tr></thead><tbody id="mineBody"></tbody></table></div>
  `;
  draw();
  return wrap;
}

/* ============================== TEACHER: PROFILE ============================== */
function viewProfile(){
  const u = State.currentUser;
  const wrap = el(`<div></div>`);
  const totalTaken = q1("SELECT COALESCE(SUM(quantity),0) c FROM borrowings WHERE user_id=?", [u.id]).c;
  const onHand = currentBorrowedCount(u.id);
  wrap.innerHTML = `
    <div class="section-head"><div><div class="kicker">Обліковий запис</div><h1>Профіль</h1></div></div>
    <div class="grid cols-2">
      <div class="card">
        <h3 style="margin-bottom:10px;">${escapeHtml(userFullName(u))}</h3>
        <p class="hint">Логін: <span class="stamp">@${escapeHtml(u.login)}</span></p>
        <p class="hint">Роль: ${roleLabel(u.role)}</p>
        <p class="hint">Клас: ${escapeHtml(className(u.class_id))}</p>
        <p class="hint">Обліковий запис створено: ${fmtDate(u.created_at)}</p>
        <hr style="border:none; border-top:1px solid var(--border); margin:14px 0;">
        <form id="pwForm">
          <div class="field"><label>Новий пароль</label><input type="password" name="password" autocomplete="new-password" placeholder="Залиште порожнім, щоб не змінювати"></div>
          <button class="btn primary sm" type="submit">Змінити пароль</button>
        </form>
      </div>
      <div class="grid" style="grid-template-columns:1fr; gap:14px;">
        <div class="stat"><div class="num">${onHand}</div><div class="lbl">Книг на руках зараз</div></div>
        <div class="stat"><div class="num">${totalTaken}</div><div class="lbl">Всього взято за весь час</div></div>
      </div>
    </div>
  `;
  wrap.querySelector("#pwForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const pass = new FormData(e.target).get("password");
    if(!pass){ toast("Введіть новий пароль.","err"); return; }
    const hash = await sha256Hex(pass);
    run("UPDATE users SET password_hash=? WHERE id=?", [hash, u.id]);
    logAction("Зміна пароля","user",u.id,"Користувач змінив власний пароль.");
    toast("Пароль оновлено.","ok");
    e.target.reset();
  });
  return wrap;
}
